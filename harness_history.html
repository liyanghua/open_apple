<!DOCTYPE html> <html lang="zh-CN"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>Agent Harness 演进历史</title> <style> :root{ --bg1:#f8fbff; --bg2:#f4f7fb; --ink:#1f2d3d; --sub:#5b6878; --line:#d8e0ea; --shadow: 0 10px 30px rgba(46, 62, 84, 0.10); } * { box-sizing: border-box; } body{ margin:0; font-family: Arial, Helvetica, "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, var(--bg1), var(--bg2)); color: var(--ink); } .page{ width: 100%; min-height: 100vh; padding: 24px; } .wrap{ max-width: 1800px; margin: 0 auto; background: transparent; } .header{ text-align:center; margin-bottom: 16px; } .header h1{ margin: 8px 0 10px; font-size: 36px; line-height: 1.2; color: var(--ink); } .header p{ margin: 0; font-size: 16px; color: var(--sub); } .hint{ text-align:center; color: #738295; font-size: 13px; margin: 10px 0 18px; } .board{ width:100%; overflow:auto; border-radius: 20px; } svg{ width: 100%; height: auto; display:block; background: transparent; } </style> </head> <body> <div class="page"> <div class="wrap"> <div class="header"> <h1>Agent Harness 演进历史：从 Prompt Agent 到 Enterprise OS</h1> <p>主线：从“让模型会做事” → “让任务能持续推进” → “让状态可信、可恢复、可管理” → “让组织级执行闭环成立”</p> </div> <div class="hint">建议浏览器全屏查看；如果用于汇报，可直接在浏览器中导出为 PDF。</div> <div class="board"> <svg viewBox="0 0 1800 1380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent Harness 演进历史图"> <defs> <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"> <stop offset="0%" stop-color="#f8fbff"/> <stop offset="100%" stop-color="#f4f7fb"/> </linearGradient> <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"> <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#9aa7b8" flood-opacity="0.18"/> </filter> <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"> <path d="M0,0 L12,6 L0,12 Z" fill="#6b7a90"/> </marker> <style> .title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #1f2d3d; } .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #5b6878; } .card-title { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #1f2d3d; } .gen-tag { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: white; } .section { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #2e3a49; } .body { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #405063; } .small { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #5b6878; } .footer { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #263445; } </style> </defs> <rect x="0" y="0" width="1800" height="1380" fill="url(#bg)"/> <!-- Timeline arrows --> <line x1="525" y1="300" x2="635" y2="300" stroke="#6b7a90" stroke-width="3" marker-end="url(#arrow)"/> <line x1="1105" y1="300" x2="1215" y2="300" stroke="#6b7a90" stroke-width="3" marker-end="url(#arrow)"/> <path d="M1505 470 C1505 520, 1505 560, 1450 560 L1450 620 C1450 675, 1390 675, 1330 675" fill="none" stroke="#6b7a90" stroke-width="3" marker-end="url(#arrow)"/> <line x1="1165" y1="840" x2="1055" y2="840" stroke="#6b7a90" stroke-width="3" marker-end="url(#arrow)"/> <line x1="585" y1="840" x2="475" y2="840" stroke="#6b7a90" stroke-width="3" marker-end="url(#arrow)"/> <!-- Card 1 --> <g filter="url(#shadow)"> <rect x="55" y="140" rx="20" ry="20" width="470" height="320" fill="#ffffff" stroke="#d8e0ea"/> <rect x="80" y="165" rx="12" ry="12" width="88" height="34" fill="#5b8def"/> <text x="124" y="188" text-anchor="middle" class="gen-tag">第1代</text> <text x="80" y="232" class="card-title">Prompt Agent</text> <text x="80" y="270" class="section">核心解决问题</text> <text x="80" y="292" class="body"> <tspan x="80" dy="0">让 LLM 首次形成“思考 → 行动 → 观察”</tspan> <tspan x="80" dy="19">的最小闭环，能完成短链任务。</tspan> </text> <text x="80" y="340" class="section">局限性</text> <text x="80" y="362" class="body"> <tspan x="80" dy="0">- 主要靠 prompt 驱动，状态极脆弱</tspan> <tspan x="80" dy="19">- 几乎没有稳定工具/权限/沙箱边界</tspan> <tspan x="80" dy="19">- 长任务只能靠堆上下文，易漂移</tspan> <tspan x="80" dy="19">- “做了”与“真的完成”没有区别</tspan> </text> <text x="80" y="448" class="section">代表项目</text> <text x="80" y="470" class="body">ReAct / AutoGPT / BabyAGI</text> </g> <!-- Card 2 --> <g filter="url(#shadow)"> <rect x="635" y="140" rx="20" ry="20" width="470" height="320" fill="#ffffff" stroke="#d8e0ea"/> <rect x="660" y="165" rx="12" ry="12" width="88" height="34" fill="#4db6ac"/> <text x="704" y="188" text-anchor="middle" class="gen-tag">第2代</text> <text x="660" y="232" class="card-title">Tool Harness</text> <text x="660" y="270" class="section">核心解决问题</text> <text x="660" y="292" class="body"> <tspan x="660" dy="0">把工具调用、外部执行、函数接口接进来，</tspan> <tspan x="660" dy="19">让 Agent 从“会说”变成“能做事”。</tspan> </text> <text x="660" y="340" class="section">局限性</text> <text x="660" y="362" class="body"> <tspan x="660" dy="0">- 会调工具 ≠ 会完成复杂任务</tspan> <tspan x="660" dy="19">- 执行结果通常仍靠 Agent 自证</tspan> <tspan x="660" dy="19">- 多步任务中的错误会层层累积</tspan> <tspan x="660" dy="19">- 几乎没有长期状态管理</tspan> </text> <text x="660" y="448" class="section">代表项目</text> <text x="660" y="470" class="body">LangChain Agents / OpenAI Function Calling / Early Tool Agents</text> </g> <!-- Card 3 --> <g filter="url(#shadow)"> <rect x="1215" y="140" rx="20" ry="20" width="470" height="320" fill="#ffffff" stroke="#d8e0ea"/> <rect x="1240" y="165" rx="12" ry="12" width="88" height="34" fill="#f39c6b"/> <text x="1284" y="188" text-anchor="middle" class="gen-tag">第3代</text> <text x="1240" y="232" class="card-title">Context Harness</text> <text x="1240" y="270" class="section">核心解决问题</text> <text x="1240" y="292" class="body"> <tspan x="1240" dy="0">围绕 memory / compaction / skill /</tspan> <tspan x="1240" dy="19">subagent 管理上下文，缓解会话膨胀。</tspan> </text> <text x="1240" y="340" class="section">局限性</text> <text x="1240" y="362" class="body"> <tspan x="1240" dy="0">- 本质仍是“增长中的会话”</tspan> <tspan x="1240" dy="19">- 摘要/记忆可能漂移，污染后续推理</tspan> <tspan x="1240" dy="19">- 记忆不等于真实世界状态</tspan> <tspan x="1240" dy="19">- 验证机制通常仍然偏弱</tspan> </text> <text x="1240" y="448" class="section">代表项目</text> <text x="1240" y="470" class="body">Claude Code / Codex CLI / Aider / Cursor Agent</text> </g> <!-- Card 4 --> <g filter="url(#shadow)"> <rect x="1215" y="680" rx="20" ry="20" width="470" height="320" fill="#ffffff" stroke="#d8e0ea"/> <rect x="1240" y="705" rx="12" ry="12" width="88" height="34" fill="#c678dd"/> <text x="1284" y="728" text-anchor="middle" class="gen-tag">第4代</text> <text x="1240" y="772" class="card-title">Composable Harness</text> <text x="1240" y="810" class="section">核心解决问题</text> <text x="1240" y="832" class="body"> <tspan x="1240" dy="0">把 runtime 组件化：skill、sandbox、</tspan> <tspan x="1240" dy="19">approval、MCP/plugin、subagent、event log。</tspan> </text> <text x="1240" y="880" class="section">局限性</text> <text x="1240" y="902" class="body"> <tspan x="1240" dy="0">- 更像通用运行时，而非长程控制平面</tspan> <tspan x="1240" dy="19">- “任务状态谁说了算”仍不够清楚</tspan> <tspan x="1240" dy="19">- 组合很多，但缺少强制提交/验收协议</tspan> <tspan x="1240" dy="19">- 长链路出错后恢复仍依赖模型质量</tspan> </text> <text x="1240" y="988" class="section">代表项目</text> <text x="1240" y="1010" class="body">DeepSeek Harness / OpenCode / pi / Modern Agent Runtimes</text> </g> <!-- Card 5 --> <g filter="url(#shadow)"> <rect x="635" y="680" rx="20" ry="20" width="470" height="320" fill="#ffffff" stroke="#d8e0ea"/> <rect x="660" y="705" rx="12" ry="12" width="88" height="34" fill="#e35d8f"/> <text x="704" y="728" text-anchor="middle" class="gen-tag">第5代</text> <text x="660" y="772" class="card-title">Long-Horizon Meta-Harness</text> <text x="660" y="810" class="section">核心解决问题</text> <text x="660" y="832" class="body"> <tspan x="660" dy="0">把长程任务改写成“计划 → 执行 → 审计 →</tspan> <tspan x="660" dy="19">checkpoint / recover”的跨轮协议，建立 Verified State。</tspan> </text> <text x="660" y="880" class="section">局限性</text> <text x="660" y="902" class="body"> <tspan x="660" dy="0">- 状态通常仍偏自然语言，非 typed state</tspan> <tspan x="660" dy="19">- 审计成本高，token / 时间开销明显</tspan> <tspan x="660" dy="19">- verifier 往往并不完全独立</tspan> <tspan x="660" dy="19">- 缺少依赖图、真值维护与自动失效机制</tspan> </text> <text x="660" y="988" class="section">代表项目</text> <text x="660" y="1010" class="body">LongHorizon-Harness / MEA-style Loops / Meta-Harness Prototypes</text> </g> <!-- Card 6 --> <g filter="url(#shadow)"> <rect x="55" y="680" rx="20" ry="20" width="470" height="320" fill="#ffffff" stroke="#d8e0ea"/> <rect x="80" y="705" rx="12" ry="12" width="88" height="34" fill="#5f6ee5"/> <text x="124" y="728" text-anchor="middle" class="gen-tag">第6代</text> <text x="80" y="772" class="card-title">Enterprise Decision / Execution OS</text> <text x="80" y="810" class="section">核心解决问题</text> <text x="80" y="832" class="body"> <tspan x="80" dy="0">把 Agent 升级成组织级系统：任务状态、证据图、</tspan> <tspan x="80" dy="19">权限审批、组织协作、评测与学习闭环。</tspan> </text> <text x="80" y="880" class="section">局限性</text> <text x="80" y="902" class="body"> <tspan x="80" dy="0">- 实现复杂度最高，工程门槛很高</tspan> <tspan x="80" dy="19">- 强依赖 ontology、流程建模与数据治理</tspan> <tspan x="80" dy="19">- 需要组织变革，而不仅是技术升级</tspan> <tspan x="80" dy="19">- 通用成熟开源形态仍然稀缺</tspan> </text> <text x="80" y="988" class="section">代表项目</text> <text x="80" y="1010" class="body">Paperclip / StaffDeck / Enterprise Brain（目标形态）</text> </g> <!-- Bottom synthesis --> <g filter="url(#shadow)"> <rect x="90" y="1080" rx="22" ry="22" width="1620" height="210" fill="#ffffff" stroke="#d8e0ea"/> <text x="120" y="1125" class="footer">代际跃迁的本质</text> <text x="120" y="1160" class="body"> <tspan x="120" dy="0">1）第1代 → 第2代：从“只会推理”升级为“可以调用工具做事”。</tspan> <tspan x="120" dy="24">2）第2代 → 第3代：从“能做事”升级为“能在更长上下文里持续做事”。</tspan> <tspan x="120" dy="24">3）第3代 → 第4代：从“上下文管理”升级为“运行时能力可组合、可治理”。</tspan> <tspan x="120" dy="24">4）第4代 → 第5代：从“会执行”升级为“只有经过验证的结果才算进度”。</tspan> <tspan x="120" dy="24">5）第5代 → 第6代：从“单任务长程优化”升级为“组织级决策与执行操作系统”。</tspan> </text> <text x="120" y="1282" class="small"> 关键词演进：Prompt → Tool → Context → Runtime Composition → Verified State → Enterprise System </text> </g> </svg> </div> </div> </div> </body> </html>
