name: cinematic-fast
version: "1.0"
description: >
  Reference/source-led cinematic product montage optimized for a 3-5 hour run.
  The fastline locks the production script before scene planning, locks the
  creative execution plan before paid assets, then approves a sample before edit/compose.
category: cinematic
stability: beta
artifact_contract_version: 2
default_checkpoint_policy: guided

reference_input:
  supported: true
  analysis_depth: deep
  analysis_tools: [video_analyzer, scene_detect, frame_sampler]

orchestration:
  mode: executive-producer
  skill: pipelines/cinematic-fast/executive-producer
  budget_default_usd: 2.00
  max_revisions_per_stage: 3
  max_send_backs: 2
  max_wall_time_minutes: 300

extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  custom_tools: false

required_skills:
  - pipelines/cinematic-fast/executive-producer
  - pipelines/cinematic-fast/research-director
  - pipelines/cinematic-fast/proposal-director
  - pipelines/cinematic-fast/script-director
  - pipelines/cinematic-fast/scene-director
  - pipelines/cinematic-fast/asset-director
  - pipelines/cinematic-fast/sample-director
  - pipelines/cinematic-fast/edit-director
  - pipelines/cinematic-fast/compose-director
  - pipelines/cinematic-fast/publish-director
  - meta/fastline
  - meta/candidate-diversity-producer
  - meta/reviewer
  - meta/checkpoint-protocol
  - meta/animation-runtime-selector

compatible_playbooks:
  recommended: [clean-professional, flat-motion-graphics]
  also_works: [minimalist-diagram]
  custom_allowed: true

approval_groups:
  script_lock:
    members: [script]
    terminal_stage: script
    required_artifacts: [script]
  creative_lock:
    members: [proposal, scene_plan, assets]
    terminal_stage: assets
    required_artifacts: [proposal_packet, creative_control_plan, scene_plan, shot_execution_plan, asset_plan, production_lock]

stages:
  - name: research
    skill: pipelines/cinematic-fast/research-director
    produces: [research_brief, video_analysis_brief, source_media_review, media_index, reference_fingerprint, research_breakdown, reference_source_matrix, research_synthesis, research_scorecard, caption_style_fingerprint]
    required_tools: [video_analyzer, scene_detect, frame_sampler]
    tools_available: [video_analyzer, scene_detect, frame_sampler]
    checkpoint_required: true
    human_approval_default: false
    review_focus: [Reference structure is grounded, source media is actually inspected, copyright boundary is explicit]
    success_criteria: [Schema-valid research and source_media_review artifacts, reference and source paths are distinct, research breakdown/matrix/synthesis/scorecard are present]

  - name: proposal
    skill: pipelines/cinematic-fast/proposal-director
    approval_group: creative_lock
    required_artifacts_in: [research_brief, research_synthesis, research_scorecard]
    optional_artifacts_in: [video_analysis_brief, source_media_review, research_breakdown, reference_source_matrix, reference_fingerprint]
    produces: [proposal_packet, creative_control_plan, hook_plan, decision_log]
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus: [Three differentiated concepts, runtime and composition mode are surfaced, paid calls are not made]
    success_criteria: [Schema-valid proposal_packet and decision_log]

  - name: script
    skill: pipelines/cinematic-fast/script-director
    approval_group: script_lock
    approval_group_terminal: true
    required_artifacts_in: [proposal_packet, creative_control_plan]
    optional_artifacts_in: [source_media_review]
    produces: [script]
    tools_available: [transcriber]
    optional_tools: [transcriber]
    checkpoint_required: true
    human_approval_default: true
    review_focus: [Hook is immediate, copy matches approved duration, narration and captions are synchronized]
    success_criteria: [Schema-valid script artifact]

  - name: scene_plan
    skill: pipelines/cinematic-fast/scene-director
    approval_group: creative_lock
    required_artifacts_in: [script, creative_control_plan, source_media_review, video_analysis_brief, reference_fingerprint, research_breakdown, reference_source_matrix, research_synthesis]
    optional_artifacts_in: [proposal_packet, research_synthesis, research_annotations]
    produces: [scene_plan]
    tools_available: [frame_sampler, scene_detect]
    optional_tools: [frame_sampler, scene_detect]
    checkpoint_required: true
    human_approval_default: false
    review_focus: [Every beat maps to real source footage, Every scene has a non-empty shot_intent, timecodes are half-open, safe zones are explicit, Reference media is analysis-only]
    success_criteria: [Schema-valid scene_plan with source in/out points, Every shot has explainable mapping grounded in reference understanding and source fit for the intended shot, Every source mapping references a resolved research matrix row, metadata.reference_media_usage is analysis_only and every source_path comes from owned source media rather than reference media]

  - name: assets
    skill: pipelines/cinematic-fast/asset-director
    approval_group: creative_lock
    approval_group_terminal: true
    required_artifacts_in: [proposal_packet, creative_control_plan, script, scene_plan]
    produces: [shot_execution_plan, asset_plan, production_lock, approval_bundle]
    tools_available: [tts_selector, audio_mixer, subtitle_gen, media_proxy]
    required_tools: []
    optional_tools: [tts_selector, audio_mixer, subtitle_gen, media_proxy]
    checkpoint_required: true
    human_approval_default: true
    review_focus: [Lock is complete, asset plan is costed, no paid provider call occurred before approval]
    success_criteria: [Schema-valid locked shot_execution_plan, production_lock and creative approval bundle, no realized paid assets]

  - name: sample
    skill: pipelines/cinematic-fast/sample-director
    required_artifacts_in: [shot_execution_plan, asset_plan, production_lock, approval_bundle, caption_style_fingerprint]
    optional_artifacts_in: [script, scene_plan]
    produces: [asset_manifest, final_props, render_plan, sample_report, sample_execution_trace, caption_policy_revision, evaluation_report]
    required_tools: [tts_selector, audio_mixer, subtitle_gen, media_proxy, video_compose, final_qa, technical_validator, video_judge]
    tools_available: [tts_selector, audio_mixer, subtitle_gen, media_proxy, video_compose, final_qa, technical_validator, video_judge]
    checkpoint_required: true
    human_approval_default: true
    review_focus: [10-15 second sample uses approved lock, quick QA passes, no timing drift, evaluation_report produced for sample scope]
    success_criteria: [Existing assets reused where possible, sample renders through video_compose, quick QA passes]

  - name: edit
    skill: pipelines/cinematic-fast/edit-director
    required_artifacts_in: [creative_control_plan, final_props, render_plan, sample_report, caption_policy_revision]
    produces: [edit_decisions, change_impact]
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus: [No silent mutation of approved props, any change has a route and impact record]
    success_criteria: [Schema-valid edit_decisions and change_impact]

  - name: compose
    skill: pipelines/cinematic-fast/compose-director
    required_artifacts_in: [creative_control_plan, edit_decisions, asset_manifest, final_props, render_plan, caption_policy_revision, caption_style_fingerprint]
    produces: [render_report, final_review, evaluation_report]
    required_tools: [video_compose, final_qa, technical_validator, video_judge]
    tools_available: [video_compose, final_qa, technical_validator, video_judge]
    checkpoint_required: true
    human_approval_default: false
    review_focus: [Render route matches plan, full QA checks black frames, freeze, loudness, safe zones and encoding, evaluation_report produced for final scope with no fatal L1a failures]
    success_criteria: [Full render or validated mux completes, final QA passes]

  - name: publish
    skill: pipelines/cinematic-fast/publish-director
    required_artifacts_in: [render_report, final_review, evaluation_report]
    optional_artifacts_in: [optimization_policy, optimization_run]
    produces: [publish_log]
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus: [Local package is complete, platform upload is not attempted without separate authority, evaluation_report hard_gate passed and status is not fail before publishing]
    success_criteria: [Local deliverable and metadata package exist]
