<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>商品视频精剪工作室</title>
    <link rel="stylesheet" href="/ui/editorial-editor-shell.css" />
  </head>
  <body>
    <main id="editorial-editor" data-batch-id="" data-candidate-id="">
      <header class="editor-header">
        <div>
          <p class="eyebrow">Source-led Editorial Timeline V2</p>
          <h1>商品视频精剪工作室</h1>
          <p id="editor-status">正在加载编辑快照…</p>
        </div>
        <div class="editor-actions">
          <button data-action="save">保存修改</button>
          <button data-action="preview">生成预览</button>
          <button data-action="final" class="primary">生成成片</button>
        </div>
      </header>
      <section class="editor-grid">
        <aside class="panel" aria-label="商品事实约束">
          <h2>商品事实</h2>
          <p>Source-led 画面、花字和口播只能使用已批准的事实范围。</p>
          <div id="fact-scope" class="fact-list"></div>
          <h2>批准素材</h2>
          <div id="approved-assets" class="asset-list"></div>
        </aside>
        <section class="panel timeline-panel" aria-label="时间线">
          <div id="media-preview" class="media-preview"><span>等待预览</span></div>
          <div id="timeline" class="timeline"></div>
          <div id="unsupported-warning" class="warning" hidden>此功能当前不支持提交</div>
        </section>
        <aside class="panel" aria-label="版本和质量">
          <h2>版本与质量</h2>
          <div id="render-progress" class="status-card">尚未开始渲染</div>
          <div id="qa-results" class="status-card">等待服务端 QA</div>
          <div id="version-compare" class="status-card">当前为基线版本</div>
        </aside>
      </section>
    </main>
    <script src="/ui/editorial-editor-shell.js"></script>
  </body>
</html>
