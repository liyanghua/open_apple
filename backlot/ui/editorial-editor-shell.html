<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenReel 快速编辑</title>
  <link rel="stylesheet" href="/ui/editorial-editor/shell.css" />
  </head>
  <body>
  <div id="editorial-editor-shell" class="editor-shell" data-testid="editorial-editor-shell"
       data-batch-id="" data-candidate-id="">
    <header class="editor-topbar">
      <div class="editor-topbar-inner">
        <a id="backToCandidate" class="back-link" href="#">返回候选证据</a>
        <div class="title-row">
          <div>
            <p class="eyebrow">OpenReel 快速编辑 · Source-led 人工可视化编辑</p>
            <h1 id="candidateTitle">正在读取候选</h1>
            <p id="versionLine" class="muted">当前版本：读取中…</p>
          </div>
          <div id="statusBadge" class="status-badge" aria-live="polite">读取中</div>
        </div>
        <div class="context-actions">
          <button type="button" id="focusPreview" class="ghost-button" disabled aria-label="仅看画面" title="仅看画面">⛶ 仅看画面</button>
          <button type="button" id="togglePreviewFullscreen" class="ghost-button" disabled aria-label="全屏预览" title="全屏预览">全屏预览</button>
          <button type="button" id="saveDraft" class="ghost-button" disabled>保存草稿</button>
          <button type="button" id="previewImpact" class="ghost-button" disabled>预览影响</button>
          <button type="button" id="finalRender" class="ghost-button" disabled>生成成片</button>
          <button type="button" id="discardSession" class="ghost-button is-warn" disabled>退出会话</button>
        </div>
      </div>
    </header>

    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

    <main class="editor-main">
      <section id="editorSurface" class="editor-surface" aria-label="OpenReel 时间轴">
        <button type="button" id="exitPreviewFocus" class="preview-focus-exit" aria-label="还原编辑布局" title="还原编辑布局" hidden>还原编辑布局</button>
        <div id="editorFallback" class="editor-fallback" data-testid="editor-fallback">
          <p class="muted">正在加载 OpenReel 编辑器…</p>
        </div>
      </section>
      <aside id="sessionPanel" class="session-panel" aria-label="会话状态">
        <h2>会话状态</h2>
        <div class="session-summary">
          <div class="session-metric">
            <span class="session-label">待保存修改</span>
            <strong id="pendingCount">0</strong>
          </div>
          <div class="session-metric">
            <span class="session-label">不支持操作</span>
            <strong id="unsupportedCount">0</strong>
          </div>
          <div class="session-metric">
            <span class="session-label">质量检查</span>
            <strong id="qaStatus">尚未检查</strong>
          </div>
          <div class="session-metric session-metric-state">
            <span class="session-label">制作状态</span>
            <strong id="progressState">尚未开始渲染</strong>
          </div>
        </div>
        <p id="sessionState" class="muted">尚未建立编辑会话</p>
        <ul id="draftList" class="draft-list" aria-label="本地草稿提示"></ul>
        <details class="session-details">
          <summary>商品事实与批准素材</summary>
          <p id="factsSummary" class="muted">正在读取事实范围…</p>
          <ul id="assetList" class="draft-list" aria-label="批准素材与商品事实"></ul>
          <p class="muted">不支持的操作不会提交到成片时间轴。</p>
        </details>
      </aside>
    </main>
  </div>
  <script type="module" src="/ui/editorial-editor/shell.js"></script>
  </body>
</html>
