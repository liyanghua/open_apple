<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品视频制作工作台</title>
<link rel="stylesheet" href="/ui/operator/styles.css">
</head>
<body>
<div class="operator-shell" id="operator-shell" data-view-state="loading" data-mode="batch">
  <div class="approval-shell" id="approval-shell" data-testid="approval-shell" hidden>
    <header class="approval-topbar">
      <div class="approval-brand">商品视频制作工作台</div>
      <div class="approval-top-meta">
        <span>商品短视频</span>
        <span class="approval-state" id="approval-meta-state">正在读取</span>
      </div>
    </header>
    <section class="approval-hero">
      <div class="approval-hero-head">
        <div>
          <p class="approval-hero-kicker" id="approval-hero-kicker">当前需要你确认</p>
          <h1 id="approval-title">正在读取项目</h1>
          <p id="approval-note"></p>
        </div>
        <div class="approval-hero-actions">
          <a class="quiet-button approval-return-batch" id="approval-return-batch" data-testid="return-to-batch" href="#" hidden>返回批量总览</a>
          <a class="quiet-button approval-diagnostic-link" id="approval-diagnostic-link" href="/diagnostics/p/">查看诊断信息</a>
        </div>
      </div>
    </section>
    <section class="approval-rail-wrap">
      <div class="approval-rail-label">
        <span id="approval-rail-title">制作进度 · 共 9 步</span>
        <span id="approval-rail-hint">3 步需要人工确认 · 其余由系统自动完成</span>
      </div>
      <div class="approval-rail" id="approval-rail" data-testid="approval-rail"></div>
      <p class="approval-flownote" id="approval-flownote"></p>
    </section>
    <main class="approval-layout">
      <aside class="approval-materials" id="approval-materials" data-testid="approval-materials"></aside>
      <section class="approval-main" id="approval-main">
        <div class="approval-media" id="approval-media"></div>
        <div class="approval-gate-copy" id="approval-gate-copy"></div>
        <div class="approval-timeline" id="approval-timeline"></div>
        <div class="approval-outcome" id="approval-outcome"></div>
      </section>
      <aside class="approval-confirmation" id="approval-confirmation" data-testid="approval-confirmation"></aside>
    </main>
    <details class="approval-activity">
      <summary>查看制作记录</summary>
      <div class="approval-record" id="approval-record"></div>
    </details>
  </div>

  <header class="project-header">
    <div class="project-identity">
      <p class="eyebrow">视频制作项目</p>
      <h1 id="project-title">正在读取项目</h1>
    </div>
    <dl class="project-metrics" aria-label="项目概况">
      <div>
        <dt>项目总进度</dt>
        <dd id="progress-value">--</dd>
      </div>
      <div>
        <dt>当前任务</dt>
        <dd id="current-task">正在读取</dd>
      </div>
      <div>
        <dt>预计时间</dt>
        <dd id="estimated-time">暂未提供</dd>
      </div>
      <div>
        <dt>效率承诺</dt>
        <dd id="performance-promise">实测数据不足</dd>
      </div>
    </dl>
  </header>

  <main class="workbench">
    <nav class="stage-panel" aria-labelledby="stage-heading">
      <div class="panel-heading">
        <p class="eyebrow">制作流程</p>
        <h2 id="stage-heading">九个制作阶段</h2>
      </div>
      <div class="stage-list" id="stage-list"></div>
      <a class="diagnostic-link" id="diagnostic-link" href="/diagnostics/p/">查看诊断信息</a>
    </nav>

    <section class="workspace-panel" aria-labelledby="workspace-title">
      <div class="workspace-heading">
        <div>
          <p class="status-line" id="workspace-status">正在读取</p>
          <h2 id="workspace-title">阶段内容</h2>
        </div>
        <div class="workspace-actions">
          <a class="quiet-button return-to-batch" id="return-to-batch" data-testid="return-to-batch" href="#" hidden>返回批量总览</a>
          <span class="read-only-mark" id="access-mark">可编辑工作台</span>
        </div>
      </div>
      <div class="view-message" id="view-message" data-testid="workbench-message" role="status" aria-live="polite"></div>
      <div class="workspace-content" id="workspace-content"></div>
    </section>

    <aside class="next-panel" aria-labelledby="next-heading">
      <p class="eyebrow">下一步</p>
      <h2 id="next-heading">当前需要处理</h2>
      <p class="next-action" id="next-action">正在读取项目进度</p>
      <div class="review-summary" id="review-summary"></div>
    </aside>
  </main>
</div>
<script type="module" src="/ui/operator/app.js"></script>
</body>
</html>
